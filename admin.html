<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CodeNest | Quản trị</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head>
<body><header class="topbar"><a class="brand" href="store.html"><span class="brand-mark">&lt;/&gt;</span><span>codenest<span class="accent">.</span></span></a><nav><a href="store.html">Kho code</a><a href="wallet.html">Ví tiền</a><a class="active" href="admin.html">Quản trị</a></nav><button class="logout" id="logoutButton">Đăng xuất</button></header><main class="admin-shell"><section class="admin-heading"><p class="eyebrow">ADMIN CONSOLE</p><h1>Đưa code của bạn<br><em>lên kệ.</em></h1><p>Đăng tải sản phẩm mới, viết mô tả và đặt mức giá bằng Việt Nam Đồng.</p></section><section class="admin-grid"><form class="upload-card" id="productForm"><div class="card-top"><span>01 / NEW PRODUCT</span><span class="status-dot">● LIVE</span></div><label for="productName">Tên sản phẩm</label><input id="productName" required placeholder="Ví dụ: Aurora Landing Page"><label for="productDescription">Mô tả sản phẩm</label><textarea id="productDescription" required rows="4" placeholder="Sản phẩm này giúp người mua làm được gì?"></textarea><div class="two-col"><div><label for="productPrice">Giá bán (VNĐ)</label><input id="productPrice" type="number" min="1000" step="1000" required placeholder="150000"></div><div><label for="productCategory">Danh mục</label><select id="productCategory"><option value="web">Web template</option><option value="ui">UI kit</option><option value="motion">Motion</option></select></div></div><label class="file-drop" for="productFile"><span class="upload-icon">↑</span><span><b id="fileLabel">Chọn file code để tải lên</b><small>ZIP, HTML, CSS, JS · tối đa 25MB</small></span></label><input id="productFile" type="file" accept=".zip,.html,.css,.js,.json" required><button class="primary-button" type="submit">Đăng sản phẩm <span>↗</span></button><p class="form-status" id="formStatus" role="status"></p></form><aside class="preview-card"><p class="card-top">LIVE PREVIEW</p><div class="preview-art"><span>&lt;/&gt;</span></div><p class="preview-tag">YOUR CODE · NEW</p><h2 id="previewName">Tên sản phẩm của bạn</h2><p id="previewDescription">Mô tả ngắn sẽ xuất hiện ở đây.</p><strong id="previewPrice">0đ</strong></aside></section></main><script src="admin.js"></script></body></html>
